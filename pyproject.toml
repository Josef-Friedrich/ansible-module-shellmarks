[project]
name = "shellmarks"
version = "3.0.0"
description = "shellmarks is a ansible module to set bookmarks to commonly used directories like the tools shellmarks and bashmarks do."
authors = [{ name = "Josef Friedrich", email = "josef@friedrich.rocks" }]
requires-python = ">=3.12,<4"
readme = "README.rst"
license = "GPL-3.0-only"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ansible>=13.2.0",
]

[project.urls]
Repository = "https://github.com/Josef-Friedrich/ansible-module-shellmarks"

[dependency-groups]
dev = [
    "pytest>=9.0.2"
]

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shellmarks"
module-root = ""
namespace = true

[tool.mypy]
strict = false
